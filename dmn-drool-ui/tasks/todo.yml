# DMN Rule UI — plan
# Status: DONE (approved 2026-11-17)

findings:
  api_contracts:            # source: DMN Service.postman_collection.json + dmn-service source
    base_url: "http://localhost:9090 (no auth, no CORS config -> use Vite dev proxy)"
    get_schema:   { method: GET,  path: /schema, res: "JSON Schema draft-07 (title LoanApplication)" }
    list_rules:   { method: GET,  path: /rules,  res: "{ ruleIds: string[] } (sorted)" }
    get_dmn:      { method: GET,  path: "/rules/{ruleId}", res: "DMN XML text + header X-Rule-Version", err404: "{ error }" }
    add_dmn:      { method: PUT,  path: "/rules/{ruleId}", req: "raw DMN XML, Content-Type application/xml", res: "{ ruleId, version }", err400: "{ error: 'DMN compile failed', details: string[] }" }
    evaluate:     { method: POST, path: "/rules/{ruleId}/evaluate", req: "JSON map keyed by InputData name", res: "{ ruleId, version, hasErrors, decisions, messages[] }", err404: "{ error }" }
  add_dmn_accepts_dmn_xml: true   # no DRL anywhere — compatible
  backend_kie_version: 7.74.1.Final   # supports DMN 1.1-1.4 only (checked kie-dmn-backend jar)
  editor_choice:
    new_editor: "@kie-tools/dmn-editor-standalone 10.2 -> always upgrades to DMN 1.5 -> backend CANNOT compile"
    chosen: "@kie-tools/kie-editors-standalone 10.1 (classic Apache KIE DMN editor) -> writes DMN 1.2, same as Postman sample"
    api_verified: "open({container, initialContent, readOnly}) -> getContent, subscribeToContentChanges, markAsSaved, close"
  rule_id_vs_name: "backend has only ruleId; rule name entered by user IS the ruleId (validated slug)"

design:
  schema_to_dmn: |
    One InputData named after schema.title ("LoanApplication"), typeRef tLoanApplication.
    itemDefinitions generated recursively: string/enum(allowedValues)/date/number/integer->number/boolean,
    string[] -> isCollection, object -> structure (tApplicant, tAddress...), object[] -> tProperty isCollection etc.
    Evaluate body: { "LoanApplication": <form JSON> }.
  editor_instances: "Map<ruleId, EditorHandle>; each open() gets its own container + own XML string; close() on leave"
  dirty: "subscribeToContentChanges(isDirty) + beforeunload warning + confirm on Back"
  publish: "getContent() -> PUT -> on 200 markAsSaved(), show version; on 400 show details"

steps:
  - [x] scaffold Vite React TS, add kie-editors-standalone, .env.example, vite proxy
  - [x] types + services (api.ts, ruleService.ts)
  - [x] schemaToDmn.ts (template XML generator)
  - [x] useDmnEditor hook (lifecycle/registry)
  - [x] pages Home / Editor / Execute, RuleList, ExecutionForm (nested + list add/remove)
  - [x] verify: build, publish generated template to backend, evaluate, reopen
  - [x] README (setup, architecture, APIs, gaps)

decisions:
  - editor: classic KIE editor (user approved)
  - dates: typed as FEEL date + gap documented (user approved)

review:
  verified:
    - tsc + vite build pass
    - all 5 APIs via Vite proxy incl. 400 compile error and 404 shapes
    - template compiles in backend's own KIE 7.74.1 jars; nested/list/enum FEEL access evaluates correctly
    - headless Chrome: Create Rule -> editor loads template -> Publish -> backend v1 (editor XML is DMN 1.2, types+enum kept)
    - View/Modify: stamp-duty sample round-tripped through editor -> v2, evaluate matches Postman (4600000/2500000/10000000)
    - publish guard blocks when editor dropped a shape-less node (backend version unchanged)
    - Execute form: nested object, string[], object[] in object[], add/remove -> exact payload -> evaluate OK
  not_verified:
    - dirty indicator after a real manual edit inside the editor (GWT canvas not drivable headless); wiring uses documented subscribeToContentChanges
  found:
    - classic editor drops DRG nodes without DMNDI shapes -> added missing-node confirm on publish
    - dates arrive as strings at runtime (backend gap, documented)
  test_rules_created_in_backend: [ui-e2e-created, ui-e2e-probe, ui-e2e-stampduty]   # no delete API
