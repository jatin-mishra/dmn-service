server.port=9090

dmn.table=DmnRules
dmn.version-check-millis=30000
dmn.dynamodb.region=ap-south-1
# Creates the DmnRules table on startup if it does not exist (handy for LocalStack)
dmn.create-table-if-missing=true

# LocalStack. Leave empty (or remove) to use real AWS DynamoDB.
dmn.dynamodb.endpoint=http://localhost:4566

# Browser origins allowed to call the API (comma-separated patterns), e.g. the DMN editor frontend.
dmn.cors.allowed-origins=http://localhost:*
# Raw input of every failed rule upload is saved here as <ruleId>_<timestamp>.xml (+ .error.txt).
dmn.failed-upload-dir=failed-uploads
